[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionlens-ai"
version = "0.1.0"
description = "An evidence-grounded AI agent for verifiable product decision-making."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raj Pasupathy" }]
keywords = ["product-management", "evidence", "traceability", "decision-support"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The runtime set stays free of model SDKs and UI frameworks on purpose.
# DecisionLens runs its whole demo from recorded output, so the CLI needs no
# credential, no network and no vendor package. Live mode is the `live` extra;
# the Streamlit interface is the `ui` extra. `make setup` installs both.
dependencies = [
    "pydantic>=2.7",  # Phase 2 — typed domain models
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Optional: run against a real model instead of the recorded demo.
#   pip install -e ".[live]"
# Nothing in the default install path imports this, and the test suite never
# does — every live-adapter test drives an injected stand-in, offline.
live = [
    "anthropic>=0.70",
]
# Optional: the structured Streamlit interface. Kept out of the runtime set so
# the CLI, the tests and the evaluation harness never depend on a UI framework.
ui = [
    "streamlit>=1.37",
]

[project.urls]
Repository = "https://github.com/raj-principal-arch/decisionlens-ai"

[project.scripts]
decisionlens = "decision_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decision_lens*"]

# The demo cache must ship with the package: the offline demo has to work from a
# fresh install with no API key and no separate data download.
[tool.setuptools.package-data]
decision_lens = ["llm/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Resolve the package from src/ directly rather than through the editable
# install. Standard practice for a src/ layout, and it keeps `make test` working
# from a fresh clone even before `make setup` runs. The editable install is still
# what the console script will use, so Phase 12 must verify it independently.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12 rather than the 3.11 project floor, for one external reason: the `ui`
# extra pulls in numpy, whose bundled stubs use 3.12-only `type` statements, and
# mypy cannot parse them under 3.11 no matter how the imports are configured.
# The 3.11 floor is still enforced — by ruff's `target-version = "py311"` below,
# which rejects newer syntax in this repository's own code. Only the type
# checker's assumed runtime moved; `requires-python` did not.
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# Applies to third-party packages without type stubs, added in later phases.
ignore_missing_imports = true

# Don't type-check inside the UI framework. `ui.py` is a thin wiring layer whose
# correctness comes from the tested helpers it calls, not from Streamlit's own
# annotations, and checking a third-party UI library is not this project's job.
[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
follow_imports = "skip"
ignore_missing_imports = true
